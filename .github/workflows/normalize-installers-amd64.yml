name: Normalize AMD64 installer dictionary

on:
  push:
    paths:
      - "config/installers/instaladores_amd64.json"
      - "scripts/normalize_installers_amd64.py"
      - ".github/workflows/normalize-installers-amd64.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and validate dictionary
        run: |
          python3 scripts/normalize_installers_amd64.py
          python3 -m json.tool config/installers/instaladores_amd64.json >/dev/null

      - name: Commit generated dictionary if changed
        run: |
          if git diff --quiet -- config/installers/instaladores_amd64.json; then
            echo "Dictionary already normalized"
            exit 0
          fi

          git config user.name "neebles-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/installers/instaladores_amd64.json
          git commit -m "Normalize full AMD64 installer dictionary"
          git push origin HEAD:main
